name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        # The default also installs the legacy 'tools' package, which current
        # cmdline-tools no longer provide.
        packages: 'platform-tools'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3
    
    - name: Build with Gradle
      run: ./gradlew build
    
    - name: Run tests
      run: ./gradlew testDebugUnitTest

  # The kit compiles against the oldest supported Session Replay release. Run the unit tests
  # against newer releases to catch binary incompatibilities like SDK-172.
  session-replay-compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 1.2.0 and 1.3.0 resolve kotlin-stdlib 2.3, which this repo's Kotlin 1.9 compiler
        # cannot read when compiling the tests. Add them once the kit moves to Kotlin 2.
        session-replay-version: [ "1.0.6", "1.1.0", "1.5.0", "1.6.0" ]

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        # The default also installs the legacy 'tools' package, which current
        # cmdline-tools no longer provide.
        packages: 'platform-tools'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3

    - name: Run tests against Session Replay ${{ matrix.session-replay-version }}
      run: ./gradlew testDebugUnitTest -PsessionReplayTestVersion=${{ matrix.session-replay-version }}
